<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParcelTrack — Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fa;color:#172033}
header{background:#111827;color:white;padding:18px 22px}.nav{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:21px}.logo span{color:#60a5fa}.nav a{color:#cbd5e1;text-decoration:none;font-size:13px}
.layout{max-width:1200px;margin:30px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.danger{background:#fee2e2;color:#991b1b}
.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 7px 22px #1118270a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-size:12px;color:#64748b;font-weight:700;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #dbe1e8;border-radius:9px;font:inherit;outline:none}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f4;font-size:14px;white-space:nowrap}th{color:#64748b;font-size:12px}.pill{background:#dcfce7;color:#166534;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.small{font-size:12px;color:#64748b}.empty{text-align:center;color:#64748b;padding:30px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;gap:12px;flex-direction:column}}

.login-overlay{position:fixed;inset:0;background:#f3f6fa;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.login-box{width:100%;max-width:390px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 15px 45px #11182718}
.login-box h2{margin:0 0 7px}.login-box p{color:#64748b;font-size:13px;margin:0 0 22px}
.login-box input{width:100%;padding:12px;border:1px solid #dbe1e8;border-radius:9px;margin:7px 0 12px;font:inherit}
.login-box button{width:100%;border:0;border-radius:10px;padding:12px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
.login-error{color:#b91c1c;font-size:13px;margin:8px 0;display:none}
#adminApp{display:none}
</style>
</head>
<body>
<div class="login-overlay" id="loginScreen">
  <div class="login-box">
    <div class="logo" style="color:#172033;margin-bottom:18px">Parcel<span style="color:#2563eb">Track</span> Admin</div>
    <h2>Admin Login</h2>
    <p>Sign in to access the shipment dashboard.</p>
    <label>USERNAME</label>
    <input id="loginUser" autocomplete="username" placeholder="Enter username">
    <label>PASSWORD</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password">
    <div class="login-error" id="loginError">Invalid username or password.</div>
    <button onclick="login()">Login</button>
  </div>
</div>
<div id="adminApp">
<header><div class="nav"><div class="logo">Parcel<span>Track</span> Admin</div><a href="index.html">Customer Tracking →</a></div></header>
<main class="layout">
<div class="head"><div><h1>Shipment Dashboard</h1><div class="small">Manage demo shipments stored in this browser.</div></div><button class="btn danger" id="clearBtn">Clear All</button></div>
<section class="panel"><h3 id="formTitle">Add Shipment</h3>
<form id="form"><div class="grid">
<div><label>TRACKING ID *</label><input id="id" placeholder="PT10002" required></div>
<div><label>STATUS *</label><select id="status"><option>Order Placed</option><option>Picked Up</option><option>In Transit</option><option>Arrived at Delivery Hub</option><option>Out for Delivery</option><option>Delivered</option></select></div>
<div><label>CUSTOMER NAME</label><input id="customer" placeholder="Customer name"></div>
<div><label>PHONE</label><input id="phone" placeholder="Mobile number"></div>
<div><label>CURRENT LOCATION</label><input id="location" placeholder="Jaipur Delivery Hub"></div>
<div><label>EXPECTED DELIVERY</label><input id="eta" placeholder="30 September 2026"></div>
<div class="full"><label>DELIVERY ADDRESS</label><input id="address" placeholder="Full delivery address"></div>
<div class="full"><label>TIMELINE — one event per line: STATUS | DATE/TIME | DESCRIPTION</label><textarea id="events" placeholder="Out for Delivery | 30 Sep 2026, 09:15 AM | Parcel is with the delivery agent.&#10;Arrived at Delivery Hub | 30 Sep 2026, 07:20 AM | Parcel reached the local hub."></textarea></div>
</div><div class="actions"><button class="btn primary">Save Shipment</button><button type="button" class="btn" id="reset">Reset</button></div></form></section>
<section class="panel"><h3>Shipments</h3><div class="table-wrap"><table><thead><tr><th>TRACKING ID</th><th>CUSTOMER</th><th>STATUS</th><th>LOCATION</th><th>ACTIONS</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
</div>
<script>

const ADMIN_USERNAME="admin";
const ADMIN_PASSWORD="admin123";
function login(){
 const u=document.getElementById("loginUser").value;
 const p=document.getElementById("loginPass").value;
 if(u===ADMIN_USERNAME && p===ADMIN_PASSWORD){
   sessionStorage.setItem("parcelAdminAuth","1");
   document.getElementById("loginScreen").style.display="none";
   document.getElementById("adminApp").style.display="block";
 }else document.getElementById("loginError").style.display="block";
}
if(sessionStorage.getItem("parcelAdminAuth")==="1"){
 document.getElementById("loginScreen").style.display="none";
 document.getElementById("adminApp").style.display="block";
}

const demo=[{id:"PT10001",status:"Out for Delivery",location:"Jaipur Delivery Hub",eta:"30 September 2026",customer:"Demo Customer",phone:"******1234",address:"Jaipur, Rajasthan, India",events:[["Out for Delivery","30 Sep 2026, 09:15 AM","Parcel is with the delivery agent."],["Arrived at Delivery Hub","30 Sep 2026, 07:20 AM","Parcel reached the local delivery hub."],["In Transit","29 Sep 2026, 06:40 PM","Parcel is moving to the destination city."],["Picked Up","29 Sep 2026, 11:10 AM","Parcel picked up from the sender."],["Order Placed","28 Sep 2026, 04:30 PM","Shipment information received."]]}];
function get(){return JSON.parse(localStorage.getItem("parcelData")||"null")||demo}
function save(a){localStorage.setItem("parcelData",JSON.stringify(a))}
function render(){const a=get(),r=document.getElementById("rows");r.innerHTML=a.length?a.map((p,i)=>`<tr><td><b>${p.id}</b></td><td>${p.customer||"-"}</td><td><span class="pill">${p.status}</span></td><td>${p.location||"-"}</td><td><button class="btn" onclick="edit(${i})">Edit</button> <button class="btn danger" onclick="del(${i})">Delete</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">No shipments yet.</td></tr>`}
function edit(i){const p=get()[i];["id","status","customer","phone","location","eta","address"].forEach(k=>document.getElementById(k).value=p[k]||"");document.getElementById("events").value=(p.events||[]).map(e=>e.join(" | ")).join("\n");document.getElementById("formTitle").textContent="Edit Shipment";window.scrollTo({top:0,behavior:"smooth"});document.getElementById("form").dataset.edit=i}
function del(i){if(confirm("Delete this shipment?")){let a=get();a.splice(i,1);save(a);render()}}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();let a=get();const p={id:id.value.trim(),status:status.value,customer:customer.value.trim(),phone:phone.value.trim(),location:location.value.trim(),eta:eta.value.trim(),address:address.value.trim(),events:events.value.split("\n").map(x=>x.split("|").map(s=>s.trim())).filter(x=>x.length>=3&&x[0])};const idx=e.target.dataset.edit;if(idx!==undefined){a[idx]=p;delete e.target.dataset.edit}else{a.push(p)}save(a);e.target.reset();document.getElementById("formTitle").textContent="Add Shipment";render();alert("Shipment saved successfully.")});
document.getElementById("reset").onclick=()=>{document.getElementById("form").reset();delete document.getElementById("form").dataset.edit;document.getElementById("formTitle").textContent="Add Shipment"};
document.getElementById("clearBtn").onclick=()=>{if(confirm("Clear all shipment data?")){localStorage.removeItem("parcelData");render()}};
render();
</script>
</body>
</html>
